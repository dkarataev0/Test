<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход - LeadFinder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(900px 500px at 70% -10%, rgba(59,130,246,.14), transparent 60%), #0B1120;
  color: #F1F5F9; font: 15px/1.5 Inter, system-ui, sans-serif;
}
form {
  width: min(380px, 100%); background: #111A2E; border: 1px solid #1E2A44; border-radius: 18px;
  padding: 32px 28px; display: flex; flex-direction: column; gap: 18px;
  box-shadow: 0 24px 60px -20px rgba(0,0,0,.6);
}
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(135deg, #3B82F6, #6366F1); box-shadow: 0 6px 20px -6px rgba(59,130,246,.8); }
h1 { font-size: 20px; letter-spacing: -.01em; }
p { color: #94A3B8; font-size: 14px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #94A3B8; font-weight: 500; }
input { height: 46px; padding: 0 14px; border-radius: 10px; background: #0B1120; border: 1px solid #1E2A44;
  color: #F1F5F9; font: inherit; font-size: 16px; outline: none; }
input:focus { border-color: #3B82F6; }
button { height: 46px; border: 0; border-radius: 10px; background: #3B82F6; color: #fff; font: inherit;
  font-weight: 600; cursor: pointer; transition: background .15s; }
button:hover { background: #2563EB; }
button:disabled { opacity: .6; cursor: wait; }
.error { color: #FDA4AF; font-size: 14px; min-height: 21px; }
</style>
</head>
<body>
<form id="f">
  <div class="brand">
    <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg></span>
    <div><h1>LeadFinder</h1><p>Поиск клиентов на создание сайтов</p></div>
  </div>
  <label>Пароль<input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <button type="submit">Войти</button>
  <div class="error" id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = e.target.querySelector("button"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: e.target.password.value }) });
    if (r.ok) { location.href = "/"; return; }
    err.textContent = r.status === 401 ? "Неверный пароль" : `Ошибка ${r.status}`;
  } catch { err.textContent = "Нет связи с сервером"; }
  btn.disabled = false;
});
</script>
</body>
</html>
